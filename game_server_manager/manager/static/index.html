<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
  <title>Game Servers</title><link rel="stylesheet" href="static/app.css?v=2.8.7"><script src="static/app.js?v=2.8.7" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar"><div class="brand"><div class="brand-mark">G</div><div><div class="eyebrow">HOME ASSISTANT</div><h1>Game Servers</h1></div></div>
      <div class="toolbar"><span class="health-pill" id="healthPill"><i class="health-dot"></i><span id="healthText">Connecting</span></span><button class="icon-button" type="button" data-action="global-settings" title="Catalog settings" aria-label="Catalog settings">⚙</button><button class="primary-button" type="button" data-action="add-server">＋ Add server</button></div>
    </header>
    <main id="mainView"><div id="banner" class="banner hidden" role="status"></div><div class="section-heading"><div><div class="eyebrow">YOUR GAME SERVERS</div><h2>Servers</h2><p class="muted">Manage supported games here. Minecraft Java, Bedrock, and cross-play are available now. Worms Armageddon is WIP and unavailable at the moment.</p></div><div id="serverCount" class="count-pill">0 servers</div></div><section id="serverGrid" class="server-grid" aria-live="polite"></section></main>
    <main id="manageView" class="hidden"><div class="manage-heading"><button class="back-button" type="button" data-action="back">‹ <span>All servers</span></button><div class="manage-title"><div class="eyebrow">SERVER MANAGEMENT</div><h2 id="manageName">Server</h2></div><div class="manage-actions"><button class="secondary-button" type="button" data-action="logs">Terminal</button><button id="manageStartStop" class="secondary-button" type="button" data-action="toggle-server">Start</button><button class="force-exit-button" type="button" data-action="force-exit" title="Immediately stop the container and cancel pending restarts">Force exit</button><button class="danger-outline" type="button" data-action="delete-server">Remove</button></div></div><nav class="tabs" role="tablist" aria-label="Server configuration"><button id="typesTab" class="tab active" type="button" role="tab" aria-controls="manageContent" aria-selected="true" data-action="tab" data-tab="types">Types</button><button id="modsTab" class="tab" type="button" role="tab" aria-controls="manageContent" aria-selected="false" aria-disabled="true" data-action="tab" data-tab="mods" disabled>Mods</button><button id="pluginsTab" class="tab" type="button" role="tab" aria-controls="manageContent" aria-selected="false" aria-disabled="true" data-action="tab" data-tab="plugins" disabled>Plugins</button><button id="addonsTab" class="tab" type="button" role="tab" aria-controls="manageContent" aria-selected="false" aria-disabled="true" data-action="tab" data-tab="addons" disabled>Add-ons</button></nav><div id="manageContent" role="tabpanel" aria-labelledby="typesTab"></div></main>
  </div>
  <div id="overlay" class="overlay hidden"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-top"><div id="dialogEyebrow" class="eyebrow"></div><button id="closeDialog" class="close-button" type="button" aria-label="Close">×</button></div><div id="dialogContent"></div></section></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body></html>
