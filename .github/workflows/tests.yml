name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q manager

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check dashboard JavaScript syntax
        run: node --check manager/static/app.js

      - name: Build development image
        run: docker build --tag manager-for-game-servers:test .
