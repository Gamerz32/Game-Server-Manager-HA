name: "Game Server Manager"
slug: game_server_manager
description: >
  Manage multiple game servers from a Home Assistant dashboard. Minecraft Java is supported today, with room to add more games later.
version: "2.6.0"
url: https://github.com/Gamerz32/Game-Server-Manager-HA

arch:
  - amd64
  - aarch64

startup: application
boot: auto
timeout: 300
backup: cold

ingress: true
ingress_port: 8099
ingress_entry: /
panel_title: Game Servers
panel_icon: mdi:server-network
panel_admin: false

docker_api: true
host_network: false

options:
  host_networking: false
schema:
  host_networking: bool

map:
  - share:ro
