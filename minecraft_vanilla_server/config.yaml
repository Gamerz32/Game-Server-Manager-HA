name: "Minecraft Server Manager"
slug: minecraft_vanilla_server
description: >
  Manage multiple Minecraft Java servers, Vanilla, modpacks, mods, and Bukkit-compatible plugins from a Home Assistant dashboard.
version: "2.3.1"
url: https://github.com/Gamerz32/Home-Assistant-Gameservers-ADDONS/tree/main/minecraft_vanilla_server

arch:
  - amd64
  - aarch64

startup: application
boot: auto
timeout: 300
backup: cold

ingress: true
ingress_port: 8099
ingress_entry: /
panel_title: Minecraft Servers
panel_icon: mdi:minecraft
panel_admin: false

docker_api: true
host_network: false

options:
  host_networking: false
schema:
  host_networking: bool

map:
  - share:ro
