name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install -r game_server_manager/requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q game_server_manager/manager

      - name: Run unit tests
        working-directory: game_server_manager
        run: python -m unittest discover -s tests -v

      - name: Check dashboard JavaScript syntax
        run: node --check game_server_manager/manager/static/app.js
